name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  macos:
    name: macOS release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            zip_name: BitForge-macos-arm64.app.zip
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
            zip_name: BitForge-macos-x86_64.app.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS app bundle
        env:
          BINARY_PATH: ${{ github.workspace }}/target/${{ matrix.target }}/release/bitforge
          OUTPUT_DIR: ${{ runner.temp }}/bitforge-release
          ZIP_NAME: ${{ matrix.zip_name }}
        run: ./scripts/package_macos_app.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ runner.temp }}/bitforge-release/${{ matrix.zip_name }}
